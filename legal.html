        const LANGS = ['ro', 'en', 'fr', 'ru'];
        function getStored() {
            try { return localStorage.getItem('amgf-lang') || localStorage.getItem('language'); } catch (e) { return null; }
        }
        let lang = getStored();
        if (!LANGS.includes(lang)) {
            const b = (navigator.language || 'ro').slice(0, 2).toLowerCase();
            lang = LANGS.includes(b) ? b : 'ro';
        }
        function apply(l) {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const k = el.getAttribute('data-i18n');
                if (T[k] && T[k][l]) el.innerHTML = T[k][l];
            });
            document.documentElement.lang = l;
            document.title = 'AMGF - ' + T.title[l];
            const btn = document.getElementById('language-toggle');
            if (btn) btn.textContent = LANGS.map(x => x === l ? '[' + x.toUpperCase() + ']' : x.toUpperCase()).join(' / ');
        }
        apply(lang);
        document.getElementById('language-toggle').addEventListener('click', () => {
            lang = LANGS[(LANGS.indexOf(lang) + 1) % LANGS.length];
            try { localStorage.setItem('amgf-lang', lang); localStorage.setItem('language', lang); } catch (e) {}
            apply(lang);
        });
